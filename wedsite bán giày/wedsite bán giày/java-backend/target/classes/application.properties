server.address=${SWOOSH_HOST:127.0.0.1}
server.port=${PORT:${SWOOSH_PORT:8081}}
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false
swoosh.root=${SWOOSH_ROOT:..}
swoosh.jdbc-url=${SWOOSH_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=BeginnerRunningShoesDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true;authenticationScheme=NativeAuthentication}
swoosh.cookie-secure=${SWOOSH_COOKIE_SECURE:false}
swoosh.trust-proxy=${TRUST_PROXY:${SWOOSH_TRUST_PROXY:false}}
